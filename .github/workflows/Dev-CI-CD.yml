  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]

    # Environment variables for Node.js application (must match src/config/configuration.manager.ts)
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: test_db
      DB_USERNAME: ${{ secrets.MYSQL_USER }}
      DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      DB_DIALECT: mysql
      DB_SYNCHRONIZE: true
      CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
      USER_ACCESS_TOKEN_SECRET: ${{ secrets.USER_ACCESS_TOKEN_SECRET }}
      ACCESS_TOKEN_EXPIRES_IN_SECONDS: ${{ secrets.ACCESS_TOKEN_EXPIRES_IN_SECONDS }}

    # MySQL container service
    services:
      mysql:
        image: mysql:8

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: test_db
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u${{ secrets.MYSQL_USER }} -p${{ secrets.MYSQL_PASSWORD }} --silent
          do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run Test Cases
        run: npm run test:report

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: mochawesome-report/
          retention-days: 30

      - name: Email Test Report Link
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: user-crud-service CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          subject: "[user-crud-service] Test report - ${{ github.ref_name }} - ${{ job.status }}"
          body: |
            Test run finished for user-crud-service.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Trigger: ${{ github.actor }}
            Status:  ${{ job.status }}

            Download the test report (mochawesome-report artifact) from the run page:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  docker:
    name: Build & Push Docker Image (dev)
    runs-on: ubuntu-latest
    needs: [build, test, gitguardian]
    if: github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-crud-service:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/user-crud-service:dev-${{ github.sha }}
